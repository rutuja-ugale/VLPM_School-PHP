<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add Teacher</title>

<style>
    body{
        font-family: Arial;
        background: #f2f2f2;
    }

    h2{
        text-align: center;
        margin-top: 30px;
    }

    .form-box{
        width: 400px;
        margin: 50px auto;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0px 0px 10px #ccc;
    }

    input{
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    button{
        width: 100%;
        padding: 10px;
        background: #28a745;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    button:hover{
        background: #218838;
    }
</style>

</head>

<body>

<h2>Add Teacher 👨‍🏫</h2>

<div class="form-box">

    <form action="add_teacher.php" method="POST">

        <input type="text" name="name" placeholder="Teacher Name" required>

        <input type="email" name="email" placeholder="Email" required>

        <input type="text" name="subject" placeholder="Subject" required>

        <input type="text" name="phone" placeholder="Phone" required>

        <button type="submit">Add Teacher</button>

    </form>

</div>

</body>
</html>
